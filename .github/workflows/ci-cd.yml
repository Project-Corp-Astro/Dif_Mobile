name: Mobile App CI/CD

# Required secrets:
# - EXPO_TOKEN: Expo access token for building and publishing

on:
  push:
    branches: [ main, develop, feat/*, fix/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'yarn'
          
      - name: Install dependencies
        run: yarn install --frozen-lockfile
        
      - name: Run ESLint
        run: yarn lint
        
      - name: Run tests
        run: yarn test
        
      - name: Run IAP Analytics Verification
        run: cd scripts && node run_iap_analytics_verification.js
  
  build-android:
    name: Build Android App
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'yarn'
          
      - name: Install dependencies
        run: yarn install --frozen-lockfile
        
      - name: Setup EAS
        run: npm install -g eas-cli
        
      - name: Login to Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
        
      - name: Build Android app
        if: github.ref == 'refs/heads/main'
        run: eas build --platform android --profile production --non-interactive
        
      - name: Build Android app (preview)
        if: github.ref == 'refs/heads/develop'
        run: eas build --platform android --profile preview --non-interactive
  
  build-ios:
    name: Build iOS App
    needs: test
    runs-on: macos-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'yarn'
          
      - name: Install dependencies
        run: yarn install --frozen-lockfile
        
      - name: Setup EAS
        run: npm install -g eas-cli
        
      - name: Login to Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
        
      - name: Build iOS app
        if: github.ref == 'refs/heads/main'
        run: eas build --platform ios --profile production --non-interactive
        
      - name: Build iOS app (preview)
        if: github.ref == 'refs/heads/develop'
        run: eas build --platform ios --profile preview --non-interactive
